name: Warm Maven Dependency Cache

# This workflow pre-downloads all Maven dependencies via JFrog Artifactory
# and saves them to the GitHub Actions cache. Forked PRs (which cannot
# authenticate to JFrog) restore this cache to build without credentials.
#
# Triggers:
#   - push to main when pom.xml changes (keeps cache fresh after dep updates)
#   - daily schedule (prevents 7-day cache eviction)
#   - manual dispatch (with optional PR number to warm cache for a fork's pom.xml)

on:
  push:
    branches: [main]
    paths: ['**/pom.xml']
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to warm cache for (reads pom.xml from the PR branch). Leave empty to warm from main.'
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: read # Needed to read PR metadata for fork checkout
  actions: write # Needed to delete stale cache entries

jobs:
  warm-cache:
    strategy:
      matrix:
        github-runner: [linux-ubuntu-latest, windows-server-latest]
    runs-on:
      group: databricks-protected-runner-group
      labels: ${{ matrix.github-runner }}

    steps:
      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: 21
          distribution: 'adopt'

      # If PR number provided, checkout only pom.xml files from the fork (security: no source code)
      - name: Checkout PR pom.xml files (sparse)
        if: inputs.pr_number != ''
        shell: bash
        run: |
          set -euo pipefail

          # Fetch PR metadata
          PR_DATA=$(curl -sLS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}")

          FORK_REPO=$(echo "$PR_DATA" | jq -r '.head.repo.full_name')
          FORK_REF=$(echo "$PR_DATA" | jq -r '.head.ref')

          echo "Warming cache for PR #${{ inputs.pr_number }} from ${FORK_REPO}@${FORK_REF}"

          # Sparse checkout: only pom.xml files (no source code from fork)
          git init .
          git remote add fork "https://github.com/${FORK_REPO}.git"
          git config core.sparseCheckout true
          echo "**/pom.xml" > .git/info/sparse-checkout
          echo "pom.xml" >> .git/info/sparse-checkout
          git fetch --depth=1 fork "${FORK_REF}"
          git checkout FETCH_HEAD

      - name: Checkout main branch
        if: inputs.pr_number == ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get JFrog OIDC token
        shell: bash
        run: |
          set -euo pipefail

          # Get GitHub OIDC ID token
          ID_TOKEN=$(curl -sLS \
            -H "User-Agent: actions/oidc-client" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jfrog-github" | jq .value | tr -d '"')
          echo "::add-mask::${ID_TOKEN}"

          # Exchange for JFrog access token
          ACCESS_TOKEN=$(curl -sLS -XPOST -H "Content-Type: application/json" \
            "https://databricks.jfrog.io/access/api/v1/oidc/token" \
            -d "{\"grant_type\": \"urn:ietf:params:oauth:grant-type:token-exchange\", \"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\", \"subject_token\": \"${ID_TOKEN}\", \"provider_name\": \"github-actions\"}" | jq .access_token | tr -d '"')
          echo "::add-mask::${ACCESS_TOKEN}"

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "FAIL: Could not extract JFrog access token"
            exit 1
          fi

          echo "JFROG_ACCESS_TOKEN=${ACCESS_TOKEN}" >> "$GITHUB_ENV"
          echo "JFrog OIDC token obtained successfully"

      - name: Configure Maven with JFrog credentials
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <mirrors>
              <mirror>
                <id>jfrog-central</id>
                <mirrorOf>*</mirrorOf>
                <url>https://databricks.jfrog.io/artifactory/db-maven/</url>
              </mirror>
            </mirrors>
            <servers>
              <server>
                <id>jfrog-central</id>
                <username>gha-service-account</username>
                <password>${JFROG_ACCESS_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Resolve all dependencies via JFrog
        shell: bash
        run: |
          set -euo pipefail

          echo "Resolving Maven dependencies and plugins..."
          mvn -B dependency:resolve dependency:resolve-plugins -DincludeScope=test

          # Also run compile to trigger build-time downloads
          # (spotless formatters, annotation processors, etc.)
          echo "Running compile to trigger build-time downloads..."
          mvn -B compile -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true || true

          echo "Dependency resolution complete"

      - name: Save Maven dependency cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-deps-${{ hashFiles('**/pom.xml') }}

  # After warming the cache on main (push trigger), clean up stale cache entries
  # from previous pom.xml versions. This prevents old dependency versions from
  # occupying cache space after a newer version merges to main.
  #
  # Cache lifecycle:
  #   - Each unique pom.xml hash gets its own cache entry (content-addressable)
  #   - Multiple concurrent PRs with different pom.xml changes coexist in cache
  #   - When a PR merges to main, this job deletes cache entries that don't match
  #     main's current pom.xml hash, freeing space from stale PR dependency versions
  #   - GitHub also auto-evicts caches not accessed in 7 days (LRU)
  cleanup-stale-caches:
    if: github.event_name == 'push'
    needs: warm-cache
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Checkout (to compute current pom.xml hash)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Delete stale maven-deps caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Listing all maven-deps cache entries..."

          # Get the current cache key suffix (the pom.xml hash that warm-cache just saved).
          # We use the GitHub API to list caches and keep only entries matching main's hash.
          # The key format is: {OS}-maven-deps-{hash}

          # List all maven-deps cache entries as JSON
          CACHES=$(gh cache list --repo "${{ github.repository }}" --limit 200 \
            --json id,key,createdAt 2>/dev/null || echo "[]")

          if [ "$CACHES" = "[]" ] || [ -z "$CACHES" ]; then
            echo "No cache entries found"
            exit 0
          fi

          # Find the keys that were just saved by warm-cache (created in the last hour).
          # These represent main's current pom.xml hash — everything else is stale.
          FRESH_SUFFIX=$(echo "$CACHES" | jq -r '
            [.[] | select(.key | test("maven-deps-"))]
            | sort_by(.createdAt) | reverse
            | .[0].key
            | capture("maven-deps-(?<hash>.+)").hash // empty
          ')

          if [ -z "$FRESH_SUFFIX" ]; then
            echo "Could not determine current pom.xml hash from cache keys"
            exit 0
          fi

          echo "Current pom.xml hash (from latest cache): ${FRESH_SUFFIX}"

          # Delete all maven-deps entries that don't match the current hash
          DELETED=0
          KEPT=0

          echo "$CACHES" | jq -c '.[] | select(.key | test("maven-deps-"))' | while read -r ENTRY; do
            CACHE_ID=$(echo "$ENTRY" | jq -r '.id')
            CACHE_KEY=$(echo "$ENTRY" | jq -r '.key')

            if echo "$CACHE_KEY" | grep -q "$FRESH_SUFFIX"; then
              echo "KEEP: ${CACHE_KEY}"
              KEPT=$((KEPT + 1))
            else
              echo "DELETE: ${CACHE_KEY} (stale)"
              gh cache delete "$CACHE_ID" --repo "${{ github.repository }}" 2>/dev/null || true
              DELETED=$((DELETED + 1))
            fi
          done

          echo "Cleanup complete"
